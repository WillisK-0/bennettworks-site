<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="light dark"><title>Activity</title>
<style>
  :root { --bg: var(--color-background-primary, #fff); --bg2: var(--color-background-secondary, #f5f4ed); --fg: var(--color-text-primary, #141413); --fg2: var(--color-text-secondary, #3d3d3a); --fg3: var(--color-text-tertiary, #73726c); --line: var(--color-border-tertiary, rgba(31,30,29,.15)); --line2: var(--color-border-secondary, rgba(31,30,29,.3)); --inv: var(--color-background-inverse, #141413); --invfg: var(--color-text-inverse, #fff); --ok: var(--color-text-success, #265b19); --okbg: var(--color-background-success, #e9f1dc); --warn: var(--color-text-warning, #5a4815); --warnbg: var(--color-background-warning, #f6eedf); --bad: var(--color-text-danger, #7f2c28); --badbg: var(--color-background-danger, #f7ecec); --ring: var(--color-ring-primary, rgba(20,20,19,.7)); --r: var(--border-radius-md, 8px); --sans: var(--font-sans, system-ui, sans-serif); --mono: var(--font-mono, ui-monospace, monospace); }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; font-family: var(--sans); font-size: var(--font-text-sm-size, 14px); line-height: 1.45; color: var(--fg); background: transparent; }
  .wrap { padding: 4px 2px 8px; }
  :focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
  .top { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
  .top b { font-weight: 600; }
  .muted { color: var(--fg3); font-size: var(--font-text-xs-size, 12px); }
  .spacer { flex: 1; }
  .btn { border: 0.5px solid var(--line2); background: transparent; color: var(--fg); font: inherit; font-size: 12px; padding: 6px 12px; border-radius: 999px; cursor: pointer; min-height: 32px; }
  .btn:hover { background: var(--bg2); }
  .btn.pri { background: var(--inv); color: var(--invfg); border-color: var(--inv); }
  .btn:disabled { opacity: .5; cursor: default; }
  .seg { display: inline-flex; border: 0.5px solid var(--line2); border-radius: 999px; overflow: hidden; }
  .seg button { border: 0; background: transparent; color: var(--fg2); font: inherit; font-size: 12px; padding: 6px 12px; cursor: pointer; min-height: 32px; }
  .seg button.on { background: var(--inv); color: var(--invfg); }
  .pill { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 12px; border: 0.5px solid var(--line2); }
  .pill.ok { color: var(--ok); background: var(--okbg); border-color: transparent; }
  .pill.warn { color: var(--warn); background: var(--warnbg); border-color: transparent; }
  .pill.bad { color: var(--bad); background: var(--badbg); border-color: transparent; }
  .foot { display: flex; gap: 10px; align-items: center; margin-top: 8px; color: var(--fg3); font-size: 12px; flex-wrap: wrap; }
  .empty { color: var(--fg3); padding: 18px; text-align: center; }
  .skel { height: 100px; background: linear-gradient(90deg, var(--bg2) 25%, var(--bg) 50%, var(--bg2) 75%); background-size: 200% 100%; border-radius: var(--r); animation: sh 1.2s infinite; }
  @keyframes sh { from { background-position: 200% 0 } to { background-position: -200% 0 } }
  @media (prefers-reduced-motion: reduce) { .skel { animation: none; } }
  ol { list-style: none; margin: 0; padding: 0; }
  .ev { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; padding: 10px 12px; margin-bottom: 6px; border: 0.5px solid var(--line); border-left-width: 4px; border-radius: var(--r); background: var(--bg); }
  .ev.refused { border-left-style: double; border-left-width: 6px; border-color: var(--bad); background: var(--badbg); }
  .ev.waiting { border-left-style: dashed; border-color: var(--warn); background: var(--warnbg); }
  .ev .at { color: var(--fg3); font-size: 12px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .ev .what { font-weight: 600; overflow-wrap: anywhere; }
  .ev .meta { grid-column: 2; color: var(--fg3); font-size: 12px; }
  .tag { display: inline-block; margin-right: 6px; padding: 0 7px; border: 1px solid currentColor; border-radius: 999px; font-size: 11px; font-weight: 600; }
  .ev.refused .tag { color: var(--bad); }
  .ev.waiting .tag { color: var(--warn); border-style: dashed; }
  .ev.answered .tag { color: var(--ok); }
  @media (max-width: 420px) { .ev { grid-template-columns: 1fr; } .ev .meta { grid-column: 1; } }
</style></head>
<body>
<div class="wrap" id="root">
  <div class="top"><b>Activity</b><span class="muted" id="sub" role="status">Loading…</span></div>
  <div id="list"><div class="skel"></div></div>
</div>
<script type="module">
  const $ = (id) => document.getElementById(id);

  let host;
  if (window.__DEMO_HOST__) host = window.__DEMO_HOST__;
  else {
    const { App } = await import("https://unpkg.com/@modelcontextprotocol/ext-apps@1.7.5/dist/src/app-with-deps.js");
    const app = new App({ name: "Activity", version: "0.3.0" });
    host = {
      onResult: (fn) => { app.ontoolresult = fn; }, onInput: (fn) => { app.ontoolinput = fn; },
      sendMessage: (t) => app.sendMessage({ role: "user", content: [{ type: "text", text: t }] }),
      connect: () => app.connect(),
    };
  }
  const MARK = { answered: "✓ Answered", refused: "✕ Refused", "waiting for approval": "… Waiting for approval" };
  // The time exactly as written in the entry ("2026-11-16T09:07..." reads "Nov 16, 9:07 am"), never converted to the viewer's zone.
  const MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
  const wallClock = (at) => {
    const m = String(at).match(/^\d{4}-(\d\d)-(\d\d)[T ](\d\d):(\d\d)/); if (!m) return String(at);
    const h = Number(m[3]); return `${MONTHS[Number(m[1]) - 1]} ${Number(m[2])}, ${h % 12 || 12}:${m[4]} ${h < 12 ? "am" : "pm"}`;
  };
  const CLS = { answered: "answered", refused: "refused", "waiting for approval": "waiting" };
  function show(result) {
    const sc = result?.structuredContent, box = $("list"); box.replaceChildren();
    const items = Array.isArray(sc) ? sc : Array.isArray(sc?.entries) ? sc.entries : null;
    if (!items) { const e = document.createElement("div"); e.className = "empty"; e.textContent = result?.content?.[0]?.text ?? "No result."; box.appendChild(e); $("sub").textContent = ""; return; }
    const sorted = [...items].sort((a, b) => String(a.at).localeCompare(String(b.at)));
    const c = (o) => sorted.filter(x => x.outcome === o).length;
    $("sub").textContent = `${sorted.length} ${sorted.length === 1 ? "entry" : "entries"} · ${c("refused")} refused · ${c("waiting for approval")} waiting for approval`;
    if (!sorted.length) { const e = document.createElement("div"); e.className = "empty"; e.textContent = "Nothing logged yet."; box.appendChild(e); return; }
    const ol = document.createElement("ol");
    for (const x of sorted) {
      const li = document.createElement("li"); li.className = "ev " + (CLS[x.outcome] ?? "");
      const at = document.createElement("time"); at.className = "at"; at.dateTime = String(x.at).slice(0, 16); at.textContent = wallClock(x.at);
      const what = document.createElement("div"); what.className = "what"; const tag = document.createElement("span"); tag.className = "tag"; tag.textContent = MARK[x.outcome] ?? x.outcome; what.append(tag, x.asked);
      const meta = document.createElement("div"); meta.className = "meta"; meta.textContent = `${x.who}` + (x.looked?.length ? ` · looked at ${x.looked.join(", ")}` : " · looked at nothing");
      li.append(at, what, meta); ol.appendChild(li);
    }
    box.appendChild(ol);
  }
  host.onResult?.(show);
  await host.connect?.();
</script>
</body></html>
