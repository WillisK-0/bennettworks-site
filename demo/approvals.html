<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="light dark"><title>Approvals</title>
<style>
  :root { --bg: var(--color-background-primary, #fff); --bg2: var(--color-background-secondary, #f5f4ed); --fg: var(--color-text-primary, #141413); --fg2: var(--color-text-secondary, #3d3d3a); --fg3: var(--color-text-tertiary, #73726c); --line: var(--color-border-tertiary, rgba(31,30,29,.15)); --line2: var(--color-border-secondary, rgba(31,30,29,.3)); --inv: var(--color-background-inverse, #141413); --invfg: var(--color-text-inverse, #fff); --ok: var(--color-text-success, #265b19); --okbg: var(--color-background-success, #e9f1dc); --warn: var(--color-text-warning, #5a4815); --warnbg: var(--color-background-warning, #f6eedf); --bad: var(--color-text-danger, #7f2c28); --badbg: var(--color-background-danger, #f7ecec); --ring: var(--color-ring-primary, rgba(20,20,19,.7)); --r: var(--border-radius-md, 8px); --sans: var(--font-sans, system-ui, sans-serif); --mono: var(--font-mono, ui-monospace, monospace); }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; font-family: var(--sans); font-size: var(--font-text-sm-size, 14px); line-height: 1.45; color: var(--fg); background: transparent; }
  .wrap { padding: 4px 2px 8px; }
  :focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
  .top { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
  .top b { font-weight: 600; }
  .muted { color: var(--fg3); font-size: var(--font-text-xs-size, 12px); }
  .spacer { flex: 1; }
  .btn { border: 0.5px solid var(--line2); background: transparent; color: var(--fg); font: inherit; font-size: 12px; padding: 6px 12px; border-radius: 999px; cursor: pointer; min-height: 32px; }
  .btn:hover { background: var(--bg2); }
  .btn.pri { background: var(--inv); color: var(--invfg); border-color: var(--inv); }
  .btn:disabled { opacity: .5; cursor: default; }
  .seg { display: inline-flex; border: 0.5px solid var(--line2); border-radius: 999px; overflow: hidden; }
  .seg button { border: 0; background: transparent; color: var(--fg2); font: inherit; font-size: 12px; padding: 6px 12px; cursor: pointer; min-height: 32px; }
  .seg button.on { background: var(--inv); color: var(--invfg); }
  .pill { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 12px; border: 0.5px solid var(--line2); }
  .pill.ok { color: var(--ok); background: var(--okbg); border-color: transparent; }
  .pill.warn { color: var(--warn); background: var(--warnbg); border-color: transparent; }
  .pill.bad { color: var(--bad); background: var(--badbg); border-color: transparent; }
  .foot { display: flex; gap: 10px; align-items: center; margin-top: 8px; color: var(--fg3); font-size: 12px; flex-wrap: wrap; }
  .empty { color: var(--fg3); padding: 18px; text-align: center; }
  .skel { height: 100px; background: linear-gradient(90deg, var(--bg2) 25%, var(--bg) 50%, var(--bg2) 75%); background-size: 200% 100%; border-radius: var(--r); animation: sh 1.2s infinite; }
  @keyframes sh { from { background-position: 200% 0 } to { background-position: -200% 0 } }
  @media (prefers-reduced-motion: reduce) { .skel { animation: none; } }
  body { font-variant-numeric: tabular-nums; }
  .req { display: grid; grid-template-columns: 1fr auto; gap: 8px 14px; border: 0.5px solid var(--line); border-radius: var(--r); padding: 12px 14px; margin-bottom: 8px; background: var(--bg); align-items: start; }
  .req.done { opacity: .8; }
  .req .who { font-weight: 600; overflow-wrap: anywhere; }
  .req .meta { color: var(--fg3); font-size: 12px; margin-top: 2px; }
  .req .amt { font-size: 18px; font-weight: 600; text-align: right; }
  .req .rule { grid-column: 1 / -1; font-size: 12px; color: var(--fg2); background: var(--bg2); border-radius: 6px; padding: 7px 10px; }
  .req .rule b { font-weight: 600; }
  .req .acts { grid-column: 1 / -1; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .pill.pend { color: var(--fg2); border-color: var(--line2); }
  .cant { font-size: 12px; color: var(--fg3); }
</style></head>
<body>
<div class="wrap" id="root">
  <div class="top"><b id="title">Approvals</b><span class="muted" id="sub" role="status">Loading…</span><span class="spacer"></span><span class="seg" role="group" aria-label="Filter"><button id="fPend" class="on" aria-pressed="true">Pending</button><button id="fAll" aria-pressed="false">All</button></span></div>
  <div id="list"><div class="skel"></div></div>
  <div class="foot"><span>Each request shows the rule that applies. A decision is recorded; nothing else moves from here.</span><span class="spacer"></span><button class="btn" id="summ" hidden>Ask Claude to summarize my decisions</button></div>
</div>
<script type="module">
  const $ = (id) => document.getElementById(id);

  let host;
  if (window.__DEMO_HOST__) host = window.__DEMO_HOST__;
  else {
    const { App } = await import("https://unpkg.com/@modelcontextprotocol/ext-apps@1.7.5/dist/src/app-with-deps.js");
    const app = new App({ name: "Approvals", version: "0.3.0" });
    host = {
      onResult: (fn) => { app.ontoolresult = fn; }, onInput: (fn) => { app.ontoolinput = fn; },
      callTool: (name, args) => app.callServerTool({ name, arguments: args }),
      sendMessage: (t) => app.sendMessage({ role: "user", content: [{ type: "text", text: t }] }),
      connect: () => app.connect(),
    };
  }
  let reqs = [], decisions = [], onlyPending = true;
  const money = (n) => "$" + Number(n).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const cap = (s) => s.charAt(0).toUpperCase() + s.slice(1);
  const pillCls = (s) => /^(approv|accept|grant)/i.test(s) ? "ok" : /^(reject|den|declin)/i.test(s) ? "bad" : "warn";
  const shownIds = () => (onlyPending ? reqs.filter(r => !r.outcome) : reqs).map(r => r.id);
  function render() {
    const list = $("list"); list.replaceChildren();
    const pend = reqs.filter(r => !r.outcome), shown = onlyPending ? pend : reqs;
    const amounts = pend.filter(r => r.amount != null);
    $("sub").textContent = `${pend.length} pending` + (amounts.length ? ` · ${money(amounts.reduce((s, r) => s + Number(r.amount), 0))} requested` : "");
    $("fPend").className = onlyPending ? "on" : ""; $("fAll").className = onlyPending ? "" : "on";
    $("fPend").setAttribute("aria-pressed", String(onlyPending)); $("fAll").setAttribute("aria-pressed", String(!onlyPending));
    $("summ").hidden = !reqs.some(r => r.outcome);
    if (!shown.length) { const e = document.createElement("div"); e.className = "empty"; e.textContent = onlyPending ? "Nothing pending." : "No requests."; list.appendChild(e); return; }
    for (const r of shown) {
      const d = document.createElement("article"); d.className = "req" + (r.outcome ? " done" : ""); d.dataset.id = String(r.id);
      const left = document.createElement("div"); const who = document.createElement("div"); who.className = "who"; who.textContent = r.title;
      const meta = document.createElement("div"); meta.className = "meta"; meta.textContent = `Requested by ${r.requester} · ref ${r.id}`; left.append(who, meta);
      d.appendChild(left);
      const amt = document.createElement("div"); amt.className = "amt"; amt.textContent = r.amount != null ? money(r.amount) : ""; d.appendChild(amt);
      const rule = document.createElement("div"); rule.className = "rule"; const rb = document.createElement("b"); rb.textContent = "Rule: "; rule.append(rb, r.rule ?? "No rule recorded."); d.appendChild(rule);
      const acts = document.createElement("div"); acts.className = "acts";
      if (r.outcome) {
        const st = document.createElement("span"); st.className = "pill " + pillCls(r.outcome); st.textContent = r.outcome; acts.appendChild(st);
        if (r.at) { const t = document.createElement("span"); t.className = "muted"; t.textContent = "recorded " + new Date(r.at).toLocaleString(); acts.appendChild(t); }
        if (r.error) { const t = document.createElement("span"); t.className = "muted"; t.textContent = r.error; acts.appendChild(t); }
      } else {
        const st = document.createElement("span"); st.className = "pill pend"; st.textContent = "pending"; acts.appendChild(st);
        let primary = true, blocked = 0;
        for (const dec of decisions) {
          const allowed = (r.canDecide ?? []).includes(dec);
          const b = document.createElement("button"); b.type = "button"; b.className = "btn" + (allowed && primary ? " pri" : ""); b.textContent = cap(dec);
          if (allowed) {
            primary = false;
            b.onclick = async () => {
              const pos = shownIds().indexOf(r.id);
              const live = [...acts.querySelectorAll("button:not(:disabled)")];
              live.forEach(x => x.disabled = true);
              try { const res = await host.callTool("decide", { id: r.id, decision: dec }); const out = res?.structuredContent; if (!out) throw new Error(res?.content?.[0]?.text ?? "No result"); r.outcome = out.status ?? dec; r.at = out.recorded_at; r.error = null; }
              catch (e) { r.error = "Not recorded: " + e.message; live.forEach(x => x.disabled = false); b.focus(); const t = acts.querySelector(".err") ?? Object.assign(document.createElement("span"), { className: "muted err", role: "alert" }); t.textContent = r.error; acts.appendChild(t); return; }
              render();
              const st = $("list").querySelector(`[data-id="${r.id}"] .pill`);
              if (st) { st.tabIndex = -1; st.focus(); return; }
              const nxt = $("list").querySelectorAll(".req")[pos] ?? $("list").querySelectorAll(".req")[pos - 1];
              (nxt?.querySelector("button:not(:disabled)") ?? $("fPend")).focus();
            };
          } else { b.disabled = true; b.title = "Not allowed for you under this rule"; blocked++; }
          acts.appendChild(b);
        }
        if (blocked) { const c = document.createElement("span"); c.className = "cant"; c.textContent = `${blocked} ${blocked === 1 ? "action is" : "actions are"} not available to you under this rule.`; acts.appendChild(c); }
      }
      d.appendChild(acts); list.appendChild(d);
    }
  }
  function show(result) {
    const sc = result?.structuredContent;
    if (!sc || !Array.isArray(sc.requests)) { $("list").replaceChildren(); const e = document.createElement("div"); e.className = "empty"; e.textContent = result?.content?.[0]?.text ?? "No result."; $("list").appendChild(e); return; }
    reqs = sc.requests.map(r => ({ ...r })); decisions = sc.decisions ?? []; render();
  }
  $("fPend").onclick = () => { onlyPending = true; render(); }; $("fAll").onclick = () => { onlyPending = false; render(); };
  $("summ").onclick = () => host.sendMessage?.(`Summarize the decisions I just made:\n` + reqs.filter(r => r.outcome).map(r => `- ${r.title}${r.amount != null ? ` (${money(r.amount)})` : ""}: ${r.outcome}`).join("\n"));
  host.onResult?.(show);
  await host.connect?.();
</script>
</body></html>
