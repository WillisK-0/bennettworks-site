<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="light dark"><title>Document lookup</title>
<style>
  :root { --bg: var(--color-background-primary, #fff); --bg2: var(--color-background-secondary, #f5f4ed); --fg: var(--color-text-primary, #141413); --fg2: var(--color-text-secondary, #3d3d3a); --fg3: var(--color-text-tertiary, #73726c); --line: var(--color-border-tertiary, rgba(31,30,29,.15)); --line2: var(--color-border-secondary, rgba(31,30,29,.3)); --inv: var(--color-background-inverse, #141413); --invfg: var(--color-text-inverse, #fff); --ok: var(--color-text-success, #265b19); --okbg: var(--color-background-success, #e9f1dc); --warn: var(--color-text-warning, #5a4815); --warnbg: var(--color-background-warning, #f6eedf); --bad: var(--color-text-danger, #7f2c28); --badbg: var(--color-background-danger, #f7ecec); --ring: var(--color-ring-primary, rgba(20,20,19,.7)); --r: var(--border-radius-md, 8px); --sans: var(--font-sans, system-ui, sans-serif); --mono: var(--font-mono, ui-monospace, monospace); }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; font-family: var(--sans); font-size: var(--font-text-sm-size, 14px); line-height: 1.45; color: var(--fg); background: transparent; }
  .wrap { padding: 4px 2px 8px; }
  :focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
  .top { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
  .top b { font-weight: 600; }
  .muted { color: var(--fg3); font-size: var(--font-text-xs-size, 12px); }
  .spacer { flex: 1; }
  .btn { border: 0.5px solid var(--line2); background: transparent; color: var(--fg); font: inherit; font-size: 12px; padding: 6px 12px; border-radius: 999px; cursor: pointer; min-height: 32px; }
  .btn:hover { background: var(--bg2); }
  .btn.pri { background: var(--inv); color: var(--invfg); border-color: var(--inv); }
  .btn:disabled { opacity: .5; cursor: default; }
  .seg { display: inline-flex; border: 0.5px solid var(--line2); border-radius: 999px; overflow: hidden; }
  .seg button { border: 0; background: transparent; color: var(--fg2); font: inherit; font-size: 12px; padding: 6px 12px; cursor: pointer; min-height: 32px; }
  .seg button.on { background: var(--inv); color: var(--invfg); }
  .pill { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 12px; border: 0.5px solid var(--line2); }
  .pill.ok { color: var(--ok); background: var(--okbg); border-color: transparent; }
  .pill.warn { color: var(--warn); background: var(--warnbg); border-color: transparent; }
  .pill.bad { color: var(--bad); background: var(--badbg); border-color: transparent; }
  .foot { display: flex; gap: 10px; align-items: center; margin-top: 8px; color: var(--fg3); font-size: 12px; flex-wrap: wrap; }
  .empty { color: var(--fg3); padding: 18px; text-align: center; }
  .skel { height: 100px; background: linear-gradient(90deg, var(--bg2) 25%, var(--bg) 50%, var(--bg2) 75%); background-size: 200% 100%; border-radius: var(--r); animation: sh 1.2s infinite; }
  @keyframes sh { from { background-position: 200% 0 } to { background-position: -200% 0 } }
  @media (prefers-reduced-motion: reduce) { .skel { animation: none; } }
  .hit { border: 0.5px solid var(--line2); border-radius: var(--r); padding: 12px 14px; margin-bottom: 10px; background: var(--bg); }
  .hit .src { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--fg3); margin-bottom: 6px; flex-wrap: wrap; }
  .hit .src .doc { font-weight: 600; color: var(--fg2); }
  .hit h3 { margin: 0 0 6px; font-size: 14px; font-weight: 600; }
  .hit p { margin: 0 0 6px; color: var(--fg2); white-space: pre-wrap; }
  .hit p:last-child { margin-bottom: 0; }
  mark { background: var(--warnbg); color: inherit; padding: 0 2px; border-radius: 3px; text-decoration: underline; text-decoration-style: dotted; }
  .hit.best { border-color: var(--inv); }
  .hit .badge { font-size: 11px; background: var(--inv); color: var(--invfg); padding: 1px 7px; border-radius: 999px; }
</style></head>
<body>
<div class="wrap" id="root">
  <div class="top"><b id="title">Document lookup</b><span class="muted" id="sub" role="status">Searching company documents…</span></div>
  <div id="hits"><div class="skel"></div></div>
  <div class="foot"><span>Every answer shows the document and section it came from.</span><span class="spacer"></span><button class="btn" id="cite" hidden>Ask Claude to quote this in a reply</button></div>
</div>
<script type="module">
  const $ = (id) => document.getElementById(id);

  let host;
  if (window.__DEMO_HOST__) host = window.__DEMO_HOST__;
  else {
    const { App } = await import("https://unpkg.com/@modelcontextprotocol/ext-apps@1.7.5/dist/src/app-with-deps.js");
    const app = new App({ name: "Document lookup", version: "0.3.0" });
    host = {
      onResult: (fn) => { app.ontoolresult = fn; }, onInput: (fn) => { app.ontoolinput = fn; },
      sendMessage: (t) => app.sendMessage({ role: "user", content: [{ type: "text", text: t }] }),
      connect: () => app.connect(),
    };
  }
  let best = null;
  // "onboarding-procedure.md" reads as "Onboarding procedure"
  const docTitle = (file) => { const t = String(file ?? "").replace(/\.[a-z0-9]+$/i, "").replace(/[-_]+/g, " ").trim(); return t.charAt(0).toUpperCase() + t.slice(1); };
  function highlight(text, terms) {
    const frag = document.createDocumentFragment(); const ts = (terms ?? []).filter(Boolean);
    if (!ts.length) { frag.append(text); return frag; }
    const re = new RegExp("(" + ts.map(t => String(t).replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join("|") + ")", "gi");
    let last = 0; for (const m of text.matchAll(re)) { frag.append(text.slice(last, m.index)); const mk = document.createElement("mark"); mk.textContent = m[0]; frag.append(mk); last = m.index + m[0].length; }
    frag.append(text.slice(last)); return frag;
  }
  function show(result) {
    const sc = result?.structuredContent; const box = $("hits"); box.replaceChildren();
    if (!sc || !Array.isArray(sc.results)) { const e = document.createElement("div"); e.className = "empty"; e.textContent = result?.content?.[0]?.text ?? "No result."; box.appendChild(e); $("sub").textContent = ""; return; }
    const n = sc.results.length;
    $("sub").textContent = `${n} matching ${n === 1 ? "section" : "sections"} in company documents`;
    best = sc.results[0] ?? null;
    sc.results.forEach((r, i) => {
      const h = document.createElement("article"); h.className = "hit" + (i === 0 ? " best" : "");
      const src = document.createElement("div"); src.className = "src";
      const doc = document.createElement("b"); doc.className = "doc"; doc.textContent = docTitle(r.file); src.appendChild(doc);
      const sec = document.createElement("span"); sec.textContent = "› " + r.heading; src.appendChild(sec);
      if (i === 0) { const b = document.createElement("span"); b.className = "badge"; b.textContent = "Best match"; src.appendChild(b); }
      h.appendChild(src);
      const body = String(r.text ?? "").replace(/^#{1,3} .*\n?/, "").trim();
      if (body) for (const para of body.split(/\n\n+/)) { const p = document.createElement("p"); p.appendChild(highlight(para.replace(/^- /gm, "• "), r.terms)); h.appendChild(p); }
      box.appendChild(h);
    });
    $("cite").hidden = !best;
    if (!n) { const e = document.createElement("div"); e.className = "empty"; e.textContent = "Nothing in the company documents matches. Claude will say so rather than guess."; box.appendChild(e); }
  }
  $("cite").onclick = () => host.sendMessage?.(`Write a short reply using this section, and name the document it comes from:\n\n${docTitle(best.file)} › ${best.heading}\n${best.text}`);
  host.onInput?.(({ arguments: args }) => { if (args?.query) $("sub").textContent = "Searching company documents…"; });
  host.onResult?.(show);
  await host.connect?.();
</script>
</body></html>
