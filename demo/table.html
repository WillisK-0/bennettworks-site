<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="light dark"><title>Data view</title>
<style>
  :root { --bg: var(--color-background-primary, #fff); --bg2: var(--color-background-secondary, #f5f4ed); --fg: var(--color-text-primary, #141413); --fg2: var(--color-text-secondary, #3d3d3a); --fg3: var(--color-text-tertiary, #73726c); --line: var(--color-border-tertiary, rgba(31,30,29,.15)); --line2: var(--color-border-secondary, rgba(31,30,29,.3)); --inv: var(--color-background-inverse, #141413); --invfg: var(--color-text-inverse, #fff); --ok: var(--color-text-success, #265b19); --okbg: var(--color-background-success, #e9f1dc); --warn: var(--color-text-warning, #5a4815); --warnbg: var(--color-background-warning, #f6eedf); --bad: var(--color-text-danger, #7f2c28); --badbg: var(--color-background-danger, #f7ecec); --ring: var(--color-ring-primary, rgba(20,20,19,.7)); --r: var(--border-radius-md, 8px); --sans: var(--font-sans, system-ui, sans-serif); --mono: var(--font-mono, ui-monospace, monospace); }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; font-family: var(--sans); font-size: var(--font-text-sm-size, 14px); line-height: 1.45; color: var(--fg); background: transparent; }
  .wrap { padding: 4px 2px 8px; }
  .wnote { display: flex; gap: 8px; align-items: center; margin-top: 8px; color: var(--fg2); font-size: 12px; }
  .wnote .blackout { width: 2.5em; flex: none; }
  :focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
  .top { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
  .top b { font-weight: 600; }
  .muted { color: var(--fg3); font-size: var(--font-text-xs-size, 12px); }
  .spacer { flex: 1; }
  .btn { border: 0.5px solid var(--line2); background: transparent; color: var(--fg); font: inherit; font-size: 12px; padding: 6px 12px; border-radius: 999px; cursor: pointer; min-height: 32px; }
  .btn:hover { background: var(--bg2); }
  .btn.pri { background: var(--inv); color: var(--invfg); border-color: var(--inv); }
  .btn:disabled { opacity: .5; cursor: default; }
  .seg { display: inline-flex; border: 0.5px solid var(--line2); border-radius: 999px; overflow: hidden; }
  .seg button { border: 0; background: transparent; color: var(--fg2); font: inherit; font-size: 12px; padding: 6px 12px; cursor: pointer; min-height: 32px; }
  .seg button.on { background: var(--inv); color: var(--invfg); }
  .pill { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 12px; border: 0.5px solid var(--line2); }
  .pill.ok { color: var(--ok); background: var(--okbg); border-color: transparent; }
  .pill.warn { color: var(--warn); background: var(--warnbg); border-color: transparent; }
  .pill.bad { color: var(--bad); background: var(--badbg); border-color: transparent; }
  .foot { display: flex; gap: 10px; align-items: center; margin-top: 8px; color: var(--fg3); font-size: 12px; flex-wrap: wrap; }
  .empty { color: var(--fg3); padding: 18px; text-align: center; }
  .skel { height: 100px; background: linear-gradient(90deg, var(--bg2) 25%, var(--bg) 50%, var(--bg2) 75%); background-size: 200% 100%; border-radius: var(--r); animation: sh 1.2s infinite; }
  @keyframes sh { from { background-position: 200% 0 } to { background-position: -200% 0 } }
  @media (prefers-reduced-motion: reduce) { .skel { animation: none; } }
  .top .n { font-weight: 600; }
  input.q { border: 0.5px solid var(--line2); background: var(--bg); color: var(--fg); border-radius: 999px; padding: 6px 12px; font: inherit; font-size: 13px; min-width: 150px; min-height: 32px; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
  .chip { border: 0.5px solid var(--line2); border-radius: 999px; padding: 3px 10px; font: inherit; font-size: 12px; color: var(--fg2); background: transparent; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; min-height: 28px; }
  .chip.on { background: var(--inv); color: var(--invfg); border-color: var(--inv); }
  .chip b { font-weight: 600; }
  .tblwrap { border: 0.5px solid var(--line); border-radius: var(--r); overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
  caption { text-align: left; padding: 6px 10px; font-size: 12px; font-weight: 600; color: var(--fg2); }
  th, td { text-align: left; padding: 7px 10px; border-bottom: 0.5px solid var(--line); white-space: nowrap; }
  th { background: var(--bg2); color: var(--fg2); font-weight: 600; font-size: 12px; }
  th button { all: unset; cursor: pointer; display: inline-flex; gap: 4px; align-items: center; min-height: 24px; }
  th button:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
  th .dir { color: var(--fg3); font-size: 10px; }
  td.num, th.num { text-align: right; }
  tr:last-child td { border-bottom: 0; }
  tbody tr.link { cursor: pointer; }
  tbody tr.link:hover, tbody tr.sel { background: var(--bg2); }
  td button.open { all: unset; cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }
  td button.open:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
  .blackout { display: inline-block; width: 4.5em; height: 1em; vertical-align: -2px; background: var(--inv); border-radius: 3px; forced-color-adjust: none; }
  .chart { border: 0.5px solid var(--line); border-radius: var(--r); padding: 12px; }
  .chart .row { display: grid; grid-template-columns: minmax(70px, 160px) 1fr auto; gap: 10px; align-items: center; padding: 3px 0; font-size: 13px; }
  .chart .bar { height: 14px; background: var(--inv); border-radius: 3px; min-width: 2px; opacity: .85; }
  .chart .lab { color: var(--fg2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chart .val { color: var(--fg3); font-variant-numeric: tabular-nums; font-size: 12px; }
  .chart .pick { display: flex; gap: 8px 14px; flex-wrap: wrap; margin-bottom: 10px; align-items: center; font-size: 12px; color: var(--fg3); }
  .detail { margin-top: 10px; border: 0.5px solid var(--line2); border-radius: var(--r); padding: 12px; background: var(--bg); }
  .detail .hd { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; }
  .detail .hd b { font-size: 15px; }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; margin-bottom: 10px; }
  .kpi { background: var(--bg2); border-radius: var(--r); padding: 8px 10px; min-width: 0; }
  .kpi .k { color: var(--fg3); font-size: 11px; }
  .kpi .v { font-weight: 600; font-size: 15px; overflow-wrap: anywhere; }
  .tabs { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 8px; }
  .tabs button { border: 0.5px solid transparent; background: transparent; color: var(--fg2); font: inherit; font-size: 12px; padding: 5px 10px; border-radius: 999px; cursor: pointer; min-height: 30px; }
  .tabs button.on { background: var(--bg2); color: var(--fg); border-color: var(--line); }
  pre { margin: 6px 0 0; padding: 10px; background: var(--bg2); border-radius: var(--r); font-family: var(--mono); font-size: 12px; white-space: pre-wrap; color: var(--fg2); }
</style></head>
<body>
<div class="wrap" id="root">
  <div class="top">
    <span class="n" id="count" role="status">Loading</span><span class="muted" id="trunc"></span>
    <span class="spacer"></span>
    <input class="q" id="q" type="search" placeholder="Filter rows" aria-label="Filter rows">
    <span class="seg" role="group" aria-label="View"><button id="vTable" class="on" aria-pressed="true">Table</button><button id="vChart" aria-pressed="false">Chart</button></span>
    <button class="btn" id="full" title="Open full screen">Expand</button>
  </div>
  <div class="chips" id="chips" hidden></div>
  <div id="view"><div class="skel"></div></div>
  <div id="detail" hidden></div>
  <div class="wnote" id="wnote" hidden><span class="blackout" aria-hidden="true"></span><span>Black bars are withheld fields. The connector never sends them to the AI.</span></div>
  <div class="foot"><span id="status">Waiting for data.</span></div>
</div>
<script type="module">
  const $ = (id) => document.getElementById(id);

  let host;
  if (window.__DEMO_HOST__) host = window.__DEMO_HOST__;
  else {
    const { App } = await import("https://unpkg.com/@modelcontextprotocol/ext-apps@1.7.5/dist/src/app-with-deps.js");
    const app = new App({ name: "Data view", version: "0.3.0" }, { availableDisplayModes: ["inline", "fullscreen"] });
    host = {
      onResult: (fn) => { app.ontoolresult = fn; }, onInput: (fn) => { app.ontoolinput = fn; },
      callTool: (name, args) => app.callServerTool({ name, arguments: args }),
      sendMessage: (t) => app.sendMessage({ role: "user", content: [{ type: "text", text: t }] }),
      toggleFull: async () => { const m = app.getHostContext()?.displayMode === "fullscreen" ? "inline" : "fullscreen"; await app.requestDisplayMode({ mode: m }); },
      connect: () => app.connect(),
    };
  }
  const WITHHELD_LABEL = "Withheld: never sent to the AI";
  const isWithheld = (v) => v != null && typeof v === "object" && v.withheld === true;
  const isNum = (v) => typeof v === "number" || (typeof v === "string" && v.trim() !== "" && !isNaN(Number(v)));
  // Optional extras alongside a table result: labels (column name -> display label) and money (column names shown as dollars).
  // Without them, names read as words (underscores to spaces, first letter capitalised) and money falls back to a name check.
  let labels = {}, moneyCols = new Set(), centsCols = new Set();
  const label = (col) => { const k = String(col); if (Object.prototype.hasOwnProperty.call(labels, k)) return String(labels[k]); const t = k.replace(/_+/g, " ").trim(); return t.charAt(0).toUpperCase() + t.slice(1); };
  const MONEY = /^(amount|revenue|total|price|paid|outstanding|mrr|arr|cost|balance|fee|fees|spend|budget)$/i, COUNTY = /(^|_)(count|number|num|qty|quantity|seats|days)(_|$)/i;
  const isMoney = (col) => moneyCols.has(String(col)) || (!COUNTY.test(col) && String(col).split(/[_\s-]+/).some(p => MONEY.test(p)));
  const fmt = (v, col) => {
    if (v == null) return "";
    if (typeof v === "number") return isMoney(col) ? (v < 0 ? "-$" : "$") + Math.abs(v).toLocaleString(undefined, Number.isInteger(v) && !centsCols.has(String(col)) ? { maximumFractionDigits: 0 } : { minimumFractionDigits: 2, maximumFractionDigits: 2 }) : Number.isInteger(v) ? String(v) : v.toLocaleString(undefined, { maximumFractionDigits: 2 });
    return typeof v === "object" ? JSON.stringify(v) : String(v);
  };
  // One money format per column: if any amount in a column has cents, the whole column shows two decimals.
  const centsIn = (columns, rows) => new Set(columns.filter((c, i) => rows.some(r => typeof r[i] === "number" && !Number.isInteger(r[i]))).map(String));
  const pillFor = (v) => {
    const s = String(v).toLowerCase();
    if (["paid", "resolved", "active", "closed", "done", "complete", "completed", "approved"].includes(s)) return "ok";
    if (["open", "pending", "normal", "high", "review"].includes(s)) return "warn";
    if (["overdue", "escalated", "urgent", "churned", "void", "rejected", "failed", "critical"].includes(s)) return "bad";
    return "";
  };
  function blackout() { const s = document.createElement("span"); s.className = "blackout"; s.setAttribute("role", "img"); s.setAttribute("aria-label", WITHHELD_LABEL); s.title = WITHHELD_LABEL; return s; }
  function setCell(td, v, col) {
    if (isWithheld(v)) { td.appendChild(blackout()); return; }
    if (typeof v === "number") td.className = "num";
    const p = typeof v === "string" ? pillFor(v) : "";
    if (p) { const s = document.createElement("span"); s.className = "pill " + p; s.textContent = v; td.appendChild(s); } else td.textContent = fmt(v, col);
  }
  const toRows = (rows, columns) => (rows ?? []).map(r => Array.isArray(r) ? r : columns.map(c => r?.[c]));

  // --- state ---
  let data = { columns: [], rows: [], rowCount: 0, truncated: false, detailKey: null };
  let sortCol = null, sortDir = 1, filter = "", view = "table", chipFilters = {}, selected = null, groupCol = null, valueCol = null, detailTitle = "";
  const idx = (c) => data.columns.indexOf(c);
  const withheldCols = () => new Set(data.columns.filter((c, i) => data.rows.some(r => isWithheld(r[i]))));
  const usable = () => data.columns.filter(c => !withheldCols().has(c));
  const numericCols = () => usable().filter(c => { const i = idx(c); return data.rows.length && data.rows.every(r => r[i] == null || isNum(r[i])); });

  function visibleRows() {
    const ok = usable().map(idx); let rows = data.rows;
    const f = filter.trim().toLowerCase();
    if (f) rows = rows.filter(r => ok.some(i => String(r[i] ?? "").toLowerCase().includes(f)));
    for (const [c, v] of Object.entries(chipFilters)) if (v != null) rows = rows.filter(r => String(r[idx(c)]) === v);
    if (sortCol && usable().includes(sortCol)) { const i = idx(sortCol); rows = [...rows].sort((a, b) => { const x = a[i], y = b[i]; if (x == null) return 1; if (y == null) return -1; return (isNum(x) && isNum(y) ? Number(x) - Number(y) : String(x).localeCompare(String(y))) * sortDir; }); }
    return rows;
  }

  // Filter chips only where they help: a text column with 2 to 8 distinct values and no blanks, on a table with more rows
  // than that column has values plus two, so each chip narrows the list. At most two chip groups per table.
  // Dates never get chips (the chart picker skips them too); when more than two columns qualify, status-like ones come first.
  function chipColumns(columns, rows, skip) {
    const numeric = (v) => typeof v === "number" || (typeof v === "string" && v.trim() !== "" && !isNaN(Number(v)));
    const dateLike = (v) => /^\d{4}-\d\d-\d\d/.test(String(v));
    const statusLike = (c) => /(^|_)(status|state|stage|type|kind|category|renewal)(_|$)/i.test(String(c));
    const ok = columns.filter((c, i) => {
      if (skip.has(c) || rows.some(r => r[i] == null || r[i] === "")) return false;   // a blank would show as a "null" chip
      if (rows.every(r => dateLike(r[i]))) return false;
      const vals = new Set(rows.map(r => r[i]));
      return vals.size >= 2 && vals.size <= 8 && rows.length > vals.size + 2 && !rows.every(r => numeric(r[i]));
    });
    return [...ok.filter(statusLike), ...ok.filter(c => !statusLike(c))].slice(0, 2);
  }
  // end chipColumns

  function renderChips() {
    const box = $("chips"); box.replaceChildren();
    const cats = chipColumns(data.columns, data.rows, withheldCols());
    box.hidden = cats.length === 0;
    for (const c of cats) {
      const i = idx(c), counts = {}; data.rows.forEach(r => { counts[r[i]] = (counts[r[i]] ?? 0) + 1; });
      for (const [v, n] of Object.entries(counts).sort((a, b) => b[1] - a[1])) {
        const on = chipFilters[c] === v;
        const b = document.createElement("button"); b.className = "chip" + (on ? " on" : ""); b.setAttribute("aria-pressed", String(on));
        const lab = document.createElement("span"); lab.append(label(c) + ": "); const bv = document.createElement("b"); bv.textContent = v; lab.appendChild(bv);
        const cnt = document.createElement("span"); cnt.textContent = n; b.append(lab, cnt);
        b.onclick = () => { chipFilters[c] = on ? null : v; render(); };
        box.appendChild(b);
      }
    }
  }

  // one table renderer, used for the main view and for a drill-in's related tables.
  // cents: the column money format worked out from every row; the main view passes its full result so a search or chip never changes it.
  function buildTable({ columns, rows, sortable, keyCol, caption, cents }) {
    const outer = centsCols; centsCols = cents ?? centsIn(columns, rows);
    try { return buildTableWith({ columns, rows, sortable, keyCol, caption }); } finally { centsCols = outer; }
  }
  function buildTableWith({ columns, rows, sortable, keyCol, caption }) {
    const wrap = document.createElement("div"); wrap.className = "tblwrap"; wrap.tabIndex = 0; wrap.setAttribute("role", "region"); wrap.setAttribute("aria-label", caption ?? "Table");
    const t = document.createElement("table");
    if (caption) { const cap = document.createElement("caption"); cap.textContent = caption; t.appendChild(cap); }
    const hidden = new Set(columns.filter((c, i) => rows.some(r => isWithheld(r[i]))));
    const thead = document.createElement("thead"), hr = document.createElement("tr");
    columns.forEach((c, i) => {
      const th = document.createElement("th"); th.scope = "col";
      if (rows.length && rows.every(r => r[i] == null || isNum(r[i]) || isWithheld(r[i]))) th.className = "num";
      if (sortable && !hidden.has(c)) {
        th.setAttribute("aria-sort", sortCol === c ? (sortDir > 0 ? "ascending" : "descending") : "none");
        const b = document.createElement("button"); b.type = "button"; b.dataset.col = c; b.append(label(c));
        if (sortCol === c) { const d = document.createElement("span"); d.className = "dir"; d.setAttribute("aria-hidden", "true"); d.textContent = sortDir > 0 ? "▲" : "▼"; b.appendChild(d); }
        b.onclick = () => { if (sortCol === c) sortDir = -sortDir; else { sortCol = c; sortDir = 1; } render(); $("view").querySelectorAll("th button").forEach(x => { if (x.dataset.col === c) x.focus(); }); };
        th.appendChild(b);
      } else th.textContent = label(c);
      hr.appendChild(th);
    });
    thead.appendChild(hr); t.appendChild(thead);
    const tb = document.createElement("tbody"), ki = keyCol ? columns.indexOf(keyCol) : -1;
    for (const r of rows) {
      const tr = document.createElement("tr"), key = ki >= 0 ? r[ki] : null, openable = key != null && !isWithheld(key);
      if (openable) { tr.className = "link" + (selected === String(key) ? " sel" : ""); tr.onclick = (e) => { if (e.target.closest("button")) return; openDetail(String(key), r); }; }
      columns.forEach((c, i) => {
        const td = document.createElement("td"), v = r[i];
        if (openable && i === ki) {
          const b = document.createElement("button"); b.type = "button"; b.className = "open"; b.dataset.key = String(key); b.textContent = fmt(v, c); b.setAttribute("aria-expanded", String(selected === String(key)));
          b.setAttribute("aria-label", "Open " + fmt(v, c)); b.onclick = () => openDetail(String(key), r); td.appendChild(b);
          if (typeof v === "number") td.className = "num";
        } else setCell(td, v, c);
        tr.appendChild(td);
      });
      tb.appendChild(tr);
    }
    t.appendChild(tb); wrap.appendChild(t);
    if (!rows.length) { const e = document.createElement("div"); e.className = "empty"; e.textContent = "No rows."; wrap.appendChild(e); }
    return wrap;
  }

  function renderChart(rows) {
    const box = document.createElement("div"); box.className = "chart";
    const num = numericCols(), cats = usable().filter(c => !num.includes(c) && !data.rows.every(r => r[idx(c)] == null || /^\d{4}-\d\d-\d\d/.test(String(r[idx(c)]))));
    if (!groupCol || !cats.includes(groupCol)) groupCol = cats[0] ?? null;
    if (!valueCol || (valueCol !== "__count" && !num.includes(valueCol))) valueCol = num.find(c => !/(^id$|_id$)/i.test(c)) ?? "__count";
    const valueChoices = num.filter(c => !/(^id$|_id$)/i.test(c)).slice(0, 3);
    const pick = document.createElement("div"); pick.className = "pick";
    const mk = (title, opts, cur, set) => { const s = document.createElement("span"); s.append(title + " "); const seg = document.createElement("span"); seg.className = "seg"; seg.setAttribute("role", "group"); seg.setAttribute("aria-label", title); for (const o of opts) { const b = document.createElement("button"); b.type = "button"; b.textContent = o === "__count" ? "Count" : label(o); b.className = o === cur ? "on" : ""; b.setAttribute("aria-pressed", String(o === cur)); b.onclick = () => { set(o); render(); }; seg.appendChild(b); } s.appendChild(seg); return s; };
    if (cats.length) pick.appendChild(mk("by", cats.slice(0, 4), groupCol, v => groupCol = v));
    pick.appendChild(mk("show", ["__count", ...valueChoices], valueCol, v => valueCol = v));
    box.appendChild(pick);
    if (!groupCol) { const e = document.createElement("div"); e.className = "empty"; e.textContent = "Nothing to group by."; box.appendChild(e); return box; }
    const gi = idx(groupCol), vi = idx(valueCol), agg = {};
    for (const r of rows) { const k = String(r[gi] ?? "none"); agg[k] = (agg[k] ?? 0) + (valueCol === "__count" ? 1 : Number(r[vi] ?? 0)); }
    const entries = Object.entries(agg).sort((a, b) => b[1] - a[1]).slice(0, 12), max = Math.max(...entries.map(e => e[1]), 1);
    for (const [k, v] of entries) {
      const row = document.createElement("div"); row.className = "row";
      const val = valueCol === "__count" ? v.toLocaleString() : fmt(v, valueCol);
      const lab = document.createElement("span"); lab.className = "lab"; lab.textContent = k;
      const bar = document.createElement("div"); bar.className = "bar"; bar.style.width = (100 * v / max) + "%";
      const vt = document.createElement("span"); vt.className = "val"; vt.textContent = val;
      row.title = k + ": " + val;
      row.append(lab, bar, vt); box.appendChild(row);
    }
    return box;
  }

  // --- drill-in: renders whatever the detail tool returns ---
  const closeDetail = () => { const k = selected; selected = null; $("detail").hidden = true; render(); if (k != null) [...$("view").querySelectorAll("button.open")].find(b => b.dataset.key === k)?.focus(); };
  async function openDetail(key, row) {
    if (selected === key) { closeDetail(); return; }
    selected = key; render();
    const d = $("detail"); d.hidden = false; d.className = "detail"; d.replaceChildren();
    const sk = document.createElement("div"); sk.className = "skel"; sk.style.height = "80px"; d.appendChild(sk); d.setAttribute("aria-busy", "true"); updateNote();
    try {
      const res = await host.callTool("detail", { key });
      if (selected !== key) return;
      const sc = res?.structuredContent; d.removeAttribute("aria-busy");
      if (!sc || !sc.record) { showMissing("This record is not available to this role."); return; }
      renderDetail(sc);
    } catch (e) { if (selected === key) { d.removeAttribute("aria-busy"); showMissing("Could not load this record."); } }
  }
  function showMissing(msg) {
    const d = $("detail"); d.replaceChildren(); detailTitle = "";
    const p = document.createElement("div"); p.className = "empty"; p.textContent = msg; p.setAttribute("role", "status");
    const close = document.createElement("button"); close.type = "button"; close.className = "btn"; close.textContent = "Close"; close.onclick = closeDetail;
    d.append(p, close); updateNote(); close.focus({ preventScroll: true });
  }
  function renderDetail(sc) {
    const d = $("detail"); d.replaceChildren(); detailTitle = sc.title ?? "this record";
    const hd = document.createElement("div"); hd.className = "hd";
    const b = document.createElement("b"); b.textContent = detailTitle; b.tabIndex = -1; b.id = "detailTitle";
    const sp = document.createElement("span"); sp.className = "spacer";
    const ask = document.createElement("button"); ask.type = "button"; ask.className = "btn pri"; ask.textContent = "Ask about this"; ask.onclick = () => host.sendMessage?.(`Tell me more about ${detailTitle}`);
    const close = document.createElement("button"); close.type = "button"; close.className = "btn"; close.textContent = "Close"; close.onclick = closeDetail;
    hd.append(b, sp, ask, close); d.appendChild(hd);
    const k = document.createElement("div"); k.className = "kpis";
    for (const [name, val] of Object.entries(sc.record ?? {})) {
      const el = document.createElement("div"); el.className = "kpi"; const kk = document.createElement("div"); kk.className = "k"; kk.textContent = label(name); const vv = document.createElement("div"); vv.className = "v";
      if (isWithheld(val)) vv.appendChild(blackout()); else vv.textContent = val == null ? "none" : fmt(val, name);
      el.append(kk, vv); k.appendChild(el);
    }
    d.appendChild(k);
    const related = sc.related ?? [];
    if (related.length) {
      const tabs = document.createElement("div"); tabs.className = "tabs"; tabs.setAttribute("role", "group"); tabs.setAttribute("aria-label", "Related records"); const body = document.createElement("div");
      const draw = (n) => { body.replaceChildren(buildTable({ columns: related[n].columns, rows: toRows(related[n].rows, related[n].columns).slice(0, 50), sortable: false, caption: related[n].label })); [...tabs.children].forEach((x, j) => { x.className = j === n ? "on" : ""; x.setAttribute("aria-pressed", String(j === n)); }); updateNote(); };
      related.forEach((rel, n) => { const t = document.createElement("button"); t.type = "button"; t.textContent = `${rel.label} (${rel.rows.length})`; t.onclick = () => draw(n); tabs.appendChild(t); });
      d.append(tabs, body); draw(0);
    }
    updateNote(); b.focus({ preventScroll: true }); d.scrollIntoView({ block: "nearest" });
  }

  // A visible line whenever a black bar is on screen, in the main table or the open record.
  function updateNote() { $("wnote").hidden = !document.querySelector("#view .blackout, #detail:not([hidden]) .blackout"); }

  function render() {
    const rows = visibleRows(), total = data.rowCount || data.rows.length;
    $("count").textContent = `${rows.length.toLocaleString()} ${rows.length === 1 ? "row" : "rows"}` + (rows.length !== data.rows.length ? ` of ${data.rows.length.toLocaleString()}` : "");
    $("trunc").textContent = data.truncated ? `showing the first ${data.rows.length.toLocaleString()} of ${total.toLocaleString()}` : "";
    renderChips();
    $("view").replaceChildren(view === "table" ? buildTable({ columns: data.columns, rows, sortable: true, keyCol: data.detailKey, cents: centsIn(data.columns, data.rows) }) : renderChart(rows));
    $("vTable").className = view === "table" ? "on" : ""; $("vChart").className = view === "chart" ? "on" : "";
    $("vTable").setAttribute("aria-pressed", String(view === "table")); $("vChart").setAttribute("aria-pressed", String(view === "chart"));
    if (!$("detail").hidden && selected == null) $("detail").hidden = true;
    updateNote();
  }

  function show(result) {
    const sc = result?.structuredContent;
    if (!sc || !Array.isArray(sc.rows)) { $("view").replaceChildren(); const e = document.createElement("div"); e.className = "empty"; e.textContent = result?.content?.[0]?.text ?? "No result."; $("view").appendChild(e); $("count").textContent = "No data"; $("wnote").hidden = true; return; }
    const columns = sc.columns ?? (sc.rows[0] && !Array.isArray(sc.rows[0]) ? Object.keys(sc.rows[0]) : []);
    labels = sc.labels && typeof sc.labels === "object" ? sc.labels : {}; moneyCols = new Set(Array.isArray(sc.money) ? sc.money.map(String) : []);
    data = { columns, rows: toRows(sc.rows, columns), rowCount: sc.rowCount ?? sc.rows.length, truncated: !!sc.truncated, detailKey: sc.detailKey && columns.includes(sc.detailKey) ? sc.detailKey : null };
    centsCols = centsIn(data.columns, data.rows);
    sortCol = null; filter = ""; $("q").value = ""; chipFilters = {}; selected = null; $("detail").hidden = true; groupCol = null; valueCol = null;
    $("status").textContent = data.detailKey ? `Select a row to open its record. Sort by selecting a column heading.` : "Sort by selecting a column heading.";
    render();
  }

  $("q").oninput = (e) => { filter = e.target.value; render(); };
  $("vTable").onclick = () => { view = "table"; render(); };
  $("vChart").onclick = () => { view = "chart"; render(); };
  $("full").onclick = () => host.toggleFull?.();
  window.addEventListener("demo:view", (e) => { view = e.detail === "chart" ? "chart" : "table"; render(); });
  host.onResult?.(show);
  await host.connect?.();
</script>
</body></html>
